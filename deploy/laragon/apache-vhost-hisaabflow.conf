<VirtualHost *:80>
    ServerName 217.150.200.67
    DocumentRoot "C:/laragon/www/hisaabflow-web/public"

    <Directory "C:/laragon/www/hisaabflow-web/public">
        Options FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>

    ProxyPass /api/ http://127.0.0.1:8000/api/
    ProxyPassReverse /api/ http://127.0.0.1:8000/api/

    ProxyPass /health http://127.0.0.1:8000/health
    ProxyPassReverse /health http://127.0.0.1:8000/health

    ErrorLog "logs/hisaabflow-error.log"
    CustomLog "logs/hisaabflow-access.log" common
</VirtualHost>

